<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Page Header -->
        <header>
            <div>
                <h1>Super Tasking Manager</h1>
                <div class="student-info">
                    Student ID: <span id="student-id" onclick="changeStudentID()" title="Click to edit ID">654321</span>
                </div>
            </div>
            <div class="nav-links">
                <!-- Required Contribution Link -->
                <a id="contribution-link" href="contribution.html">Contribution Page</a>
            </div>
        </header>

        <!-- Required Status / Error Message Bar -->
        <div id="status-message"></div>

        <!-- Main Content Grid -->
        <div class="main-grid">

            <!-- Task Form Card -->
            <div class="card">
                <h2 class="card-title" id="form-title">Add Task</h2>
                
                <!-- Required Task Form (id="task-form") -->
                <form id="task-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="task-id-hidden" value="">

                    <div class="form-group">
                        <label for="task-title">Title *</label>
                        <!-- Required Task Title Input -->
                        <input type="text" id="task-title" required placeholder="Enter task title">
                    </div>

                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <!-- Required Task Description Input -->
                        <textarea id="task-description" rows="3" placeholder="Enter task description (optional)"></textarea>
                    </div>

                    <!-- Required Submit Button -->
                    <button type="submit" id="task-submit">Add Task</button>
                    <button type="button" id="cancel-edit-btn" class="btn-cancel" onclick="resetForm()">Cancel Edit</button>
                </form>
            </div>

            <!-- Task List Card -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px;">
                    <h2 class="card-title" style="margin: 0; border: none; padding: 0;">Tasks</h2>
                    <span id="mode-indicator" style="font-size: 0.75rem; background: #e2e3e5; padding: 2px 8px; border-radius: 4px;">LocalStorage Mode</span>
                </div>

                <!-- Required Task List Container (id="task-list") -->
                <div id="task-list">
                    <p style="text-align: center; color: #6c757d; font-size: 0.9rem;">Loading tasks...</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Application JavaScript Logic -->
    <script src="app.js"></script>
</body>
</html>
